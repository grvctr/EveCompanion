name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build EveCompanion.sln
      - run: dotnet run --project src/EveCompanion/EveCompanion.csproj --no-build -- --self-test
